# Fake AWS on your machine. Start it only when you work on the AWS features:
#   docker compose -f docker-compose.aws.yml up -d
#   docker compose -f docker-compose.aws.yml down
name: lb-aws

services:
  localstack:
    # Pinned on purpose: releases from 2026.03 on need a LocalStack account token.
    # Older than 4.10 cannot answer the CloudWatch format that current boto3 uses.
    image: localstack/localstack:4.12
    ports:
      - "127.0.0.1:4566:4566"  # every AWS service answers on this one port
    environment:
      SERVICES: sns,sqs,cloudwatch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
